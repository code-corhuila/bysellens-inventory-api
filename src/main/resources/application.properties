spring.application.name=inventory-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
spring.datasource.username=${DB_USER:inventory_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=info,prometheus
security.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64}
security.jwt.issuer=${JWT_ISSUER:bysellens-auth}
security.jwt.audience=${JWT_AUDIENCE:bysellens-api}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
inventory.events.publisher-enabled=${INVENTORY_EVENTS_PUBLISHER_ENABLED:false}
inventory.events.exchange=${INVENTORY_EVENTS_EXCHANGE:}
inventory.events.poll-interval-ms=${INVENTORY_EVENTS_POLL_INTERVAL_MS:5000}
inventory.events.confirm-timeout-ms=${INVENTORY_EVENTS_CONFIRM_TIMEOUT_MS:5000}